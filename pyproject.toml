[project]
name = "sxagent-lib"
version = "0.1.0"
description = "多 Skill Agent 库：Skill（专业能力）/ Task（业务工作）/ Sub Agent（可选执行者）三者正交——平台管机制，skill 管业务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 进包的只有库本体：app/ 是验证 CLI，skills/ 是示例，tests/ / scripts/ 不随包走。
[tool.hatch.build.targets.wheel]
packages = ["sxagent"]

[tool.hatch.build.targets.sdist]
# 只收库本体 ＋ 构建要用的元数据；`only-include` 是限定，`include` 是追加。
only-include = ["sxagent"]
include = ["README.md", "pyproject.toml"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1.post1",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# 起步配置；S6（测试与工具链重构）统一应用与调参
select = ["E", "F", "W", "I", "UP", "B", "T20"]
ignore = ["E501"]  # 行长交给 formatter

[tool.ruff.lint.per-file-ignores]
# 命令行入口和脚本的输出就是界面；库代码里禁 print 是为了防调试残留
"sxagent/__main__.py" = ["T20"]
"app/*.py" = ["T20"]
"build_cli.py" = ["T20"]
"scripts/*.py" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 这套代码里 async 是常态（图节点、工具都是 async），不为每个用例挂 marker
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# 私有制品库（阿里云云效，sx-internal）
# 凭证不进本文件：发布时用 UV_PUBLISH_USERNAME / UV_PUBLISH_PASSWORD 环境变量
# 注意：云效索引 URL 不带 /simple/ 后缀，index 根即仓库地址，uv/pip 自动拼 <包名>/
[[tool.uv.index]]
name = "aliyun-sx-internal"
url = "https://packages.aliyun.com/5fa4eee0e6f9d07f148511ec/pypi/sx-internal/"
publish-url = "https://packages.aliyun.com/5fa4eee0e6f9d07f148511ec/pypi/sx-internal/legacy/"
